<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 🔒 سياسة أمان: لا يُسمح بالاتصال إلا بخادم المواقيت. إذا غيّرت مصدراً (صور/API) عدّل السطر التالي -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; connect-src https://api.aladhan.com; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>مواقيت الصلاة | v.16</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Montserrat:wght@700;900&display=swap');

        :root {
            --dark-brown:   #120e0b;
            --accent-beige: #d1bc9b;
            --text-cream:   #f4eee0;
            /* وحدات القياس: 1% من عرض/ارتفاع الحاوية الفعلية (يضبطها الجافاسكربت، وتصلح مع التدوير) */
            --cw: 1vw;
            --ch: 1vh;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-brown);
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            background-image:
                radial-gradient(circle at center, rgba(45,34,26,0.8) 0%, var(--dark-brown) 100%),
                repeating-linear-gradient(45deg,  rgba(209,188,155,0.1) 0px, rgba(209,188,155,0.1) 1px, transparent 1px, transparent 45px),
                repeating-linear-gradient(-45deg, rgba(209,188,155,0.1) 0px, rgba(209,188,155,0.1) 1px, transparent 1px, transparent 45px);
            color: var(--text-cream);
            isolation: isolate;
        }

        /* ===================== الحاوية + أوضاع العرض ===================== */
        #appContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            display: flex;
            overflow: hidden;
            --r: min(var(--cw) * 2.5, var(--ch) * 2.5);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --set: clamp(14px, calc(var(--cw) * 2.4), 24px);
        }

        /* وضع طولي / مربع: كل شيء فوق بعض، الأحجام تتبع العرض أو الارتفاع أيهما أصغر */
        .mode-tall {
            flex-direction: column;
            padding: calc(var(--ch) * 1.2) calc(var(--cw) * 2.5);
            gap: calc(var(--ch) * 1);
            --date:   min(var(--cw) * 3.8,  var(--ch) * 2.3);
            --day:    min(var(--cw) * 9,    var(--ch) * 5.2);
            --clock:  min(var(--cw) * 21,   var(--ch) * 12.5);
            --count:  min(var(--cw) * 4.3,  var(--ch) * 2.8);
            --dhikr:  min(var(--cw) * 4.6,  var(--ch) * 2.7);
            --row:    min(var(--cw) * 6.2,  var(--ch) * 4.3);
            --cardt:  min(var(--cw) * 5.6,  var(--ch) * 3.6);
            --alert-t: min(var(--cw) * 6,   var(--ch) * 4);
            --alert-n: min(var(--cw) * 24,  var(--ch) * 14);
        }

        /* وضع عرضي: عمودان (المعلومات على اليمين، الجدول على اليسار) */
        .mode-wide {
            flex-direction: row;
            padding: calc(var(--ch) * 2.5) calc(var(--cw) * 1.8);
            gap: calc(var(--cw) * 1.6);
            --date:   min(var(--cw) * 2.5,  var(--ch) * 4.2);
            --day:    min(var(--cw) * 5.6,  var(--ch) * 9);
            --clock:  min(var(--cw) * 9.6,  var(--ch) * 20);
            --count:  min(var(--cw) * 2.8,  var(--ch) * 4.6);
            --dhikr:  min(var(--cw) * 2.5,  var(--ch) * 4.2);
            --row:    min(var(--cw) * 3.4,  var(--ch) * 6.2);
            --cardt:  min(var(--cw) * 3.6,  var(--ch) * 6.4);
            --alert-t: min(var(--cw) * 3,   var(--ch) * 6);
            --alert-n: min(var(--cw) * 13,  var(--ch) * 24);
        }

        .panel-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .mode-tall .panel-info { flex: 0 0 auto; width: 100%; gap: calc(var(--ch) * 0.8); }
        .mode-wide .panel-info { flex: 0 0 44%; height: 100%; justify-content: space-evenly; }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            gap: calc(var(--ch) * 0.4);
        }

        #fullDate {
            font-size: var(--date);
            font-weight: 900;
            color: var(--accent-beige);
            opacity: 0.92;
            line-height: 1.3;
        }
        #fullDate .sep { margin: 0 0.5em; opacity: 0.4; }
        .mode-tall #fullDate { white-space: nowrap; }
        .mode-wide #fullDate span { display: block; }
        .mode-wide #fullDate .sep { display: none; }

        #dayName {
            font-weight: 900;
            font-size: var(--day);
            line-height: 1.05;
            color: #fff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .clock-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: calc(var(--clock) * 0.06);
            direction: ltr;
        }
        #mainClock {
            font-family: 'Montserrat', sans-serif;
            font-size: var(--clock);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.03em;
            color: var(--accent-beige);
            text-shadow: 0 0 40px rgba(209,188,155,0.3);
            font-variant-numeric: tabular-nums;
        }
        .clock-sub { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; direction: rtl; }
        #secondsClock {
            font-family: 'Montserrat', sans-serif;
            font-size: calc(var(--clock) * 0.3);
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        #ampm { font-size: calc(var(--clock) * 0.2); font-weight: 900; color: var(--accent-beige); }

        .countdown-wrapper {
            background: var(--accent-beige);
            color: var(--dark-brown);
            padding: calc(var(--count) * 0.22) calc(var(--count) * 0.8);
            border-radius: calc(var(--count) * 0.6);
            display: inline-block;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        #nextPrayerCountdown {
            font-size: var(--count);
            font-weight: 900;
            line-height: 1.35;
            text-align: center;
        }
        #nextPrayerCountdown .cd-time { display: inline-block; margin-right: 0.5em; font-variant-numeric: tabular-nums; direction: ltr; }
        .mode-wide #nextPrayerCountdown .cd-time { display: block; margin: 0; font-size: 1.45em; line-height: 1.2; }

        .dhikr-box {
            flex: 0 0 auto;
            width: 100%;
            height: calc(var(--dhikr) * 3.2);
            padding: 0 calc(var(--dhikr) * 0.6);
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: calc(var(--r) * 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0);
            overflow: hidden;
        }
        .mode-wide .dhikr-box { height: calc(var(--dhikr) * 3.4); }

        #dhikrText {
            color: var(--text-cream);
            font-weight: 800;
            font-size: calc(var(--dhikr) * var(--ds, 1));
            text-align: center;
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
            line-height: 1.35;
            width: 100%;
            word-wrap: break-word;
        }
        .dhikr-fade { opacity: 0; transform: translateY(5px); }

        .content-area {
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            position: relative;
            overflow: hidden;
            border-radius: var(--r);
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .prayer-list-container {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: var(--r);
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: stretch;
            padding: calc(var(--ch) * 0.4);
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: transform 0.8s var(--ease);
            overflow: hidden;
        }

        #promoImage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: var(--r);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(105%);
            transition: transform 0.8s var(--ease);
            z-index: 10;
        }

        .prayer-row {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 calc(var(--row) * 0.4);
            border-bottom: 1px solid rgba(209,188,155,0.08);
            font-size: var(--row);
            font-weight: 900;
            color: var(--text-cream);
        }
        .prayer-row:last-child { border-bottom: none; }

        .col-name  { width: 33%; text-align: center; }
        .col-adhan { width: 33%; text-align: center; font-size: 1.15em; direction: rtl; }
        .col-iqama { width: 33%; text-align: center; font-size: 1.15em; color: var(--accent-beige); direction: rtl; }

        .next-active {
            background: linear-gradient(90deg, rgba(209,188,155,0.22), transparent, rgba(209,188,155,0.22)) !important;
            border-radius: calc(var(--r) * 0.5);
            border: max(2px, calc(var(--cw) * 0.22)) solid var(--accent-beige) !important;
            color: #fff !important;
        }

        /* ===================== الإعدادات ===================== */
        #settingsIcon {
            position: absolute;
            top: calc(var(--ch) * 1);
            right: calc(var(--cw) * 1.5);
            width:  max(20px, min(calc(var(--cw) * 3.2), calc(var(--ch) * 3.2)));
            height: max(20px, min(calc(var(--cw) * 3.2), calc(var(--ch) * 3.2)));
            opacity: 0.3;
            cursor: pointer;
            z-index: 50;
            color: var(--accent-beige);
        }

        #settingsOverlay {
            background: #000;
            z-index: 7000;
            padding: 1em 1.2em;
            display: none;
            flex-direction: column;
            position: absolute;
            inset: 0;
            color: white;
            font-size: var(--set);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .set-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8em; gap: 0.6em; flex-wrap: wrap; }
        .set-head h2 { font-size: 1.4em; font-weight: 900; color: var(--accent-beige); }
        .set-rot { display: flex; gap: 0.4em; }
        .set-rot button { background: #fff; padding: 0.3em 0.8em; border-radius: 0.4em; font-size: 0.85em; font-weight: 700; color: #000; cursor: pointer; border: none; font-family: inherit; }
        .set-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14em, 1fr)); gap: 0.7em; margin-top: 0.6em; }
        .adj-card { background: rgba(255,255,255,0.05); padding: 0.7em; border-radius: 0.8em; border: 1px solid var(--accent-beige); }
        .adj-card .ttl { font-weight: 900; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.4em; margin-bottom: 0.5em; color: var(--accent-beige); font-size: 0.95em; }
        .adj-card select { width: 100%; background-color: #2a211b; padding: 0.45em; border-radius: 0.4em; color: #fff; font-size: 0.95em; font-family: inherit; border: 1px solid rgba(255,255,255,0.15); }
        .adj-row { display: flex; justify-content: space-between; align-items: center; padding: 0.2em 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; font-weight: 700; }
        .adj-ctl { display: flex; align-items: center; gap: 0.3em; }
        .adj-btn { width: 1.9em; height: 1.9em; background: rgba(255,255,255,0.12); border-radius: 0.4em; font-weight: 700; cursor: pointer; border: none; color: #fff; font-size: 1em; font-family: inherit; }
        .adj-val { min-width: 2em; text-align: center; font-weight: 700; }
        #cityStatus { font-size: 0.8em; margin-top: 0.5em; min-height: 1.2em; color: var(--accent-beige); opacity: 0.9; }
        .set-note { font-size: 0.75em; opacity: 0.6; margin-top: 0.3em; }
        .set-save { width: 100%; background: var(--accent-beige); color: #000; padding: 0.6em; border-radius: 0.7em; font-weight: 900; font-size: 1.1em; margin-top: 1em; cursor: pointer; border: none; font-family: inherit; }

        /* ===================== الأذكار بعد الصلاة ===================== */
        #afterPrayerOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s var(--ease);
        }
        #afterPrayerOverlay.fade-in { opacity: 1; }
        #dhikrImageDisplay { width: 100%; height: 100%; object-fit: contain; display: none; }

        #dhikrDisplayArea {
            width: 100%;
            height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .card-dhikr {
            position: absolute;
            background: rgba(28,22,18,0.95);
            border: max(2px, calc(var(--cardt) * 0.08)) solid var(--accent-beige);
            border-radius: calc(var(--cardt) * 0.9);
            padding: calc(var(--cardt) * 0.8) calc(var(--cardt) * 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: calc(var(--cw) * 92);
            opacity: 0;
            transform: scale(0.92) translateY(20px);
            transition: all 0.8s var(--ease);
            pointer-events: none;
        }
        .mode-wide .card-dhikr { width: calc(var(--cw) * 80); }
        .card-dhikr .ct { font-size: var(--cardt); font-weight: bold; line-height: 1.5; color: var(--text-cream); }
        .card-dhikr .cr { font-size: calc(var(--cardt) * 0.62); font-weight: 900; color: var(--accent-beige); margin-top: calc(var(--cardt) * 0.5); }
        .card-dhikr.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        .overlay-window {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: 0.6s var(--ease);
            z-index: 2000;
            background: var(--dark-brown);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .overlay-window.active { opacity: 1; visibility: visible; }

        #alertTitle      { font-size: var(--alert-t); font-weight: bold; margin-bottom: calc(var(--alert-t) * 0.5); opacity: 0.6; }
        #alertPrayerName { font-size: var(--alert-n); font-weight: 900; color: var(--accent-beige); line-height: 1.1; }
    </style>
</head>
<body>

<div id="appContainer" class="mode-tall">

    <div id="blackOverlay" class="overlay-window" style="background:#000;z-index:8000;"></div>

    <svg id="settingsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" onclick="toggleSettings()" role="button" aria-label="الإعدادات">
        <line x1="3" y1="6"  x2="21" y2="6"/><circle cx="9"  cy="6"  r="2.2" fill="currentColor"/>
        <line x1="3" y1="12" x2="21" y2="12"/><circle cx="16" cy="12" r="2.2" fill="currentColor"/>
        <line x1="3" y1="18" x2="21" y2="18"/><circle cx="8"  cy="18" r="2.2" fill="currentColor"/>
    </svg>

    <div class="panel-info">
        <div class="header">
            <p id="fullDate">
                <span id="hijriDate">--</span>
                <span class="sep">|</span>
                <span id="gregorianDate">جاري التحميل...</span>
            </p>
            <h1 id="dayName">--</h1>
            <div class="clock-row">
                <span id="mainClock">00:00</span>
                <div class="clock-sub">
                    <span id="secondsClock">00</span>
                    <span id="ampm">--</span>
                </div>
            </div>
            <div class="countdown-wrapper">
                <div id="nextPrayerCountdown">النظام مجاني (للاستخدام)</div>
            </div>
        </div>

        <div class="dhikr-box">
            <div id="dhikrText">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</div>
        </div>
    </div>

    <div class="content-area">
        <div class="prayer-list-container" id="prayerList"></div>
        <img id="promoImage" src="https://lh3.googleusercontent.com/d/1AgGLc8gka3w9uyamV6Epo7XohbkEBc1s" alt="Promo">
    </div>

    <div id="settingsOverlay">
        <div class="set-head">
            <h2>الإعدادات</h2>
            <div class="set-rot">
                <button onclick="rotate(0)">طبيعي</button>
                <button onclick="rotate(90)">يمين</button>
                <button onclick="rotate(-90)">يسار</button>
            </div>
        </div>

        <div class="set-grid">
            <div class="adj-card">
                <p class="ttl">المدينة (مواقيت أم القرى)</p>
                <select id="citySelect" onchange="changeCity(this.value)"></select>
                <p id="cityStatus"></p>
                <p class="set-note" id="dataInfo"></p>
            </div>
            <div class="adj-card">
                <p class="ttl">طريقة ظهور الأذكار بعد الصلاة</p>
                <select id="dhikrModeSelect" onchange="saveDhikrMode()">
                    <option value="cards">بطاقات الأذكار المتتالية</option>
                    <option value="image">صورة ثابتة (5 دقائق)</option>
                </select>
            </div>
            <div class="adj-card">
                <p class="ttl">الشاشة السوداء (دقائق)</p>
                <div id="blackScreenAdjList"></div>
            </div>
        </div>

        <div class="set-grid">
            <div class="adj-card">
                <p class="ttl">تعديل الأذان (دقائق)</p>
                <div id="adhanAdjList"></div>
            </div>
            <div class="adj-card">
                <p class="ttl">تعديل الإقامة (دقائق)</p>
                <div id="iqamaAdjList"></div>
            </div>
        </div>

        <button class="set-save" onclick="toggleSettings()">حفظ وإغلاق</button>
    </div>

    <div id="afterPrayerOverlay">
        <img id="dhikrImageDisplay" src="https://lh3.googleusercontent.com/d/19D5mEhjwqlaaWwCTeGtpgj_Et12_kjNg" alt="الأذكار">
        <div id="dhikrDisplayArea"></div>
    </div>

    <div id="alertOverlay" class="overlay-window">
        <p id="alertTitle">الآن يرفع أذان</p>
        <p id="alertPrayerName">--</p>
    </div>

</div>

<script>
    const $ = function(id) { return document.getElementById(id); };

    // =========================================================================
    // ✏️ ===== إعدادات قابلة للتعديل =====
    // =========================================================================
    // مصدر المواقيت: Aladhan API (islamic.network) - طريقة 4 = جامعة أم القرى، مكة المكرمة
    const API_BASE     = "https://api.aladhan.com/v1/calendar/";
    const CALC_METHOD  = 4;          // ⚠️ لا تغيّره: 4 = أم القرى (يتحقق الكود من أن الاستجابة بنفس الرقم قبل الحفظ)
    const CAL_METHOD   = "UAQ";      // تقويم أم القرى الهجري
    const TIMEZONE     = "Asia/Riyadh";
    const DEFAULT_CITY = "madinah";  // المدينة الافتراضية عند أول تشغيل

    // ✏️ المدن (الإحداثيات: خط العرض lat / خط الطول lng) - يمكنك إضافة مدينة بنسخ سطر
    const CITIES = [
        { id: "madinah",  ar: "المدينة المنورة", lat: 24.5247, lng: 39.5692 },
        { id: "makkah",   ar: "مكة المكرمة",     lat: 21.3891, lng: 39.8579 },
        { id: "riyadh",   ar: "الرياض",          lat: 24.7136, lng: 46.6753 },
        { id: "jeddah",   ar: "جدة",             lat: 21.5433, lng: 39.1728 },
        { id: "dammam",   ar: "الدمام",          lat: 26.4207, lng: 50.0888 },
        { id: "khobar",   ar: "الخبر",           lat: 26.2172, lng: 50.1971 },
        { id: "qatif",    ar: "القطيف",          lat: 26.5196, lng: 50.0115 },
        { id: "jubail",   ar: "الجبيل",          lat: 27.0046, lng: 49.6460 },
        { id: "ahsa",     ar: "الأحساء (الهفوف)", lat: 25.3648, lng: 49.5870 },
        { id: "taif",     ar: "الطائف",          lat: 21.2703, lng: 40.4158 },
        { id: "yanbu",    ar: "ينبع",            lat: 24.0895, lng: 38.0618 },
        { id: "tabuk",    ar: "تبوك",            lat: 28.3838, lng: 36.5550 },
        { id: "buraidah", ar: "بريدة",           lat: 26.3260, lng: 43.9750 },

    // =========================================================================
    // === إزاحات المستخدم (مع تحقق من سلامة البيانات المخزنة) ===
    // =========================================================================
    function defaultOffsets() {
        return {
            adhan: { Fajr:0, Sunrise:0, Dhuhr:0, Asr:0, Maghrib:0, Isha:0 },
            iqama: { Fajr:0, Sunrise:0, Dhuhr:0, Asr:0, Maghrib:0, Isha:0 },
            black: { Fajr:13, Dhuhr:7, Asr:7, Maghrib:7, Isha:12 }
        };
    }
    function loadOffsets() {
        var d = defaultOffsets(), s = lsJSON(OFF_K);
        if (s && typeof s === 'object') {
            ['adhan','iqama','black'].forEach(function(t) {
                if (s[t] && typeof s[t] === 'object') {
                    Object.keys(d[t]).forEach(function(k) {
                        var v = Number(s[t][k]);
                        if (isFinite(v)) d[t][k] = Math.max(t === 'black' ? 0 : -180, Math.min(180, Math.round(v)));
                    });
                }
            });
        }
        return d;
    }
    var userOffsets = loadOffsets();

    // =========================================================================
    // === بيانات المواقيت: جلب من Aladhan (أم القرى) + تحقق + حفظ محلي للعمل بدون إنترنت ===
    // =========================================================================
    var prayerData = null;
    var dataMeta   = null;
    var fetching   = false;
    var lastTry    = 0;

    function getCity() {
        var id = lsGet(CITY_K) || DEFAULT_CITY;
        for (var i = 0; i < CITIES.length; i++) if (CITIES[i].id === id) return CITIES[i];
        for (var j = 0; j < CITIES.length; j++) if (CITIES[j].id === DEFAULT_CITY) return CITIES[j];
        return CITIES[0];
    }

    function cleanTime(s) {
        var m = /^(\d{1,2}):(\d{2})/.exec(String(s == null ? '' : s));
        if (!m) return null;
        var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
        if (h > 23 || mi > 59) return null;
        return (h < 10 ? '0' : '') + h + ':' + m[2];
    }

    // يتحقق من شكل البيانات ويحتفظ بالحقول اللازمة فقط (يحافظ على نفس بنية الكود القديم)
    function normalizeYear(raw, year) {
        if (!raw || typeof raw !== 'object') return null;
        var out = {};
        for (var mo = 1; mo <= 12; mo++) {
            var arr = raw[String(mo)];
            if (!Array.isArray(arr) || arr.length < 28 || arr.length > 31) return null;
            if (year && arr.length !== new Date(year, mo, 0).getDate()) return null;
            var days = [];
            for (var i = 0; i < arr.length; i++) {
                var d = arr[i];
                if (!d || !d.timings || !d.date || !d.date.hijri) return null;
                var t = {};
                for (var ki = 0; ki < keys.length; ki++) {
                    var v = cleanTime(d.timings[keys[ki]]);
                    if (!v) return null;
                    t[keys[ki]] = v;
                }
                var h  = d.date.hijri;
                var hd = parseInt(h.day, 10);
                var hm = parseInt(h.month && h.month.number, 10);
                if (!(hd >= 1 && hd <= 30) || !(hm >= 1 && hm <= 12)) return null;
                days.push({
                    timings: t,
                    date: { hijri: { day: String(hd), month: { number: hm, ar: String((h.month && h.month.ar) || '').slice(0, 30) }, year: String(h.year || '').slice(0, 4) } }
                });
            }
            out[String(mo)] = days;
        }
        return out;
    }

    async function fetchCityYear(city, year) {
        var url = API_BASE + year +
            '?latitude=' + city.lat + '&longitude=' + city.lng +
            '&method=' + CALC_METHOD + '&calendarMethod=' + CAL_METHOD +
            '&timezonestring=' + encodeURIComponent(TIMEZONE) + '&annual=true';
        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var tm = ctrl ? setTimeout(function() { ctrl.abort(); }, 25000) : null;
        try {
            var r = await fetch(url, { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var j = await r.json();
            if (!j || j.code !== 200 || !j.data) throw new Error('bad response');
            // 🔒 تأكيد 100% أن الحساب بطريقة أم القرى قبل قبول البيانات
            var first = j.data["1"] && j.data["1"][0];
            var mm = first && first.meta && first.meta.method;
            if (!mm || mm.id !== CALC_METHOD) throw new Error('method mismatch');
            var data = normalizeYear(j.data, year);
            if (!data) throw new Error('invalid data');
            return data;
        } finally {
            if (tm) clearTimeout(tm);
        }
    }

    function saveData(data, city, year) {
        var meta = { city: city.id, year: year, method: CALC_METHOD, at: Date.now() };
        var ok = lsSet(DATA_K, JSON.stringify(data));
        if (ok) lsSet(META_K, JSON.stringify(meta));
        prayerData = data;
        dataMeta = meta;
        return ok;
    }

    function loadCached() {
        var raw = lsJSON(DATA_K);
        var data = raw ? normalizeYear(raw, null) : null;
        if (data) { prayerData = data; dataMeta = lsJSON(META_K); }
        return !!data;
    }

    function isFresh() {
        var city = getCity(), y = new Date().getFullYear();
        return !!(prayerData && dataMeta && dataMeta.city === city.id && dataMeta.year === y && dataMeta.method === CALC_METHOD);
    }

    // تحديث تلقائي (عند الحاجة فقط: أول تشغيل / تغيّر المدينة / تغيّر السنة)
    async function refreshData(force) {
        if (fetching) return false;
        if (!force && isFresh()) return true;
        if (!force && lastTry && Date.now() - lastTry < 10 * 60 * 1000) return false;
        fetching = true; lastTry = Date.now();
        try {
            var city = getCity(), year = new Date().getFullYear();
            var data = await fetchCityYear(city, year);
            saveData(data, city, year);
            renderDataInfo();
            return true;
        } catch (e) {
            return false;
        } finally {
            fetching = false;
        }
    }

    function setStatus(t) { $('cityStatus').textContent = t || ''; }

    function renderDataInfo() {
        var el = $('dataInfo');
        if (!dataMeta || !dataMeta.at) { el.textContent = ''; return; }
        var d = new Date(dataMeta.at);
        el.textContent = 'مصدر: تقويم أم القرى • آخر تحديث: ' + d.toLocaleDateString('ar-SA', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function populateCities() {
        var sel = $('citySelect');
        sel.innerHTML = '';
        CITIES.forEach(function(c) {
            var o = document.createElement('option');
            o.value = c.id;
            o.textContent = c.ar;
            sel.appendChild(o);
        });
        sel.value = getCity().id;
    }

    async function changeCity(id) {
        var city = null;
        for (var i = 0; i < CITIES.length; i++) if (CITIES[i].id === id) city = CITIES[i];
        if (!city) return;
        if (fetching) { $('citySelect').value = getCity().id; setStatus('يتم التحميل الآن، حاول بعد قليل'); return; }
        fetching = true;
        setStatus('جاري تحميل مواقيت ' + city.ar + '...');
        try {
            var year = new Date().getFullYear();
            var data = await fetchCityYear(city, year);
            lsSet(CITY_K, city.id);
            saveData(data, city, year);
            setStatus('تم اعتماد مواقيت ' + city.ar);
            renderDataInfo();
            if (!engineOn) startEngine();
            update();
        } catch (e) {
            $('citySelect').value = getCity().id;
            setStatus('تعذّر التحميل (تأكد من الإنترنت). بقيت المدينة: ' + getCity().ar);
        } finally {
            fetching = false;
        }
    }

    // =========================================================================
    // === التخطيط المتجاوب + التدوير ===
    // =========================================================================
    var ROT = (function() { var r = parseInt(lsGet(ROT_K), 10); return (r === 90 || r === -90) ? r : 0; })();

    function applyLayout() {
        var c = $('appContainer');
        var iw = window.innerWidth, ih = window.innerHeight;
        var swap = (ROT === 90 || ROT === -90);
        var W = swap ? ih : iw, H = swap ? iw : ih;
        c.style.width  = W + 'px';
        c.style.height = H + 'px';
        c.style.transform = 'translate(-50%, -50%) rotate(' + ROT + 'deg)';
        c.style.setProperty('--cw', (W / 100) + 'px');
        c.style.setProperty('--ch', (H / 100) + 'px');
        var wide = (W / H) >= 1.35;
        c.classList.toggle('mode-wide', wide);
        c.classList.toggle('mode-tall', !wide);
        fitDhikr();
    }
    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', function() { setTimeout(applyLayout, 150); });

    function rotate(deg) {
        ROT = deg;
        lsSet(ROT_K, String(deg));
        $('dhikrModeSelect').value = (deg !== 0) ? "image" : "cards";
        saveDhikrMode();
        applyLayout();
    }

    function saveDhikrMode() { lsSet(DHIKR_MODE_K, $('dhikrModeSelect').value); }

    // يصغّر خط الذكر تلقائياً إذا كان النص طويلاً حتى لا يخرج من الصندوق
    function fitDhikr() {
        var el = $('dhikrText'), box = el.parentElement;
        el.style.setProperty('--ds', '1');
        var s = 1, guard = 0;
        while (el.scrollHeight > box.clientHeight + 1 && s > 0.45 && guard++ < 14) {
            s -= 0.06;
            el.style.setProperty('--ds', s.toFixed(2));
        }
    }

    function setDhikrText(text) {
        $('dhikrText').innerText = text;
        fitDhikr();
    }

    // =========================================================================
    // === لوحة التعديلات ===
    // =========================================================================
    function adjust(t, k, v) {
        var cur = userOffsets[t][k] + v;
        userOffsets[t][k] = Math.max(t === 'black' ? 0 : -180, Math.min(180, cur));
        lsSet(OFF_K, JSON.stringify(userOffsets));
        renderAdjusters();
        if (prayerData) update();
    }

    function renderAdjusters() {
        var adH = '', iqH = '', blH = '';
        keys.forEach(function(k) {
            var row = function(t, v) {
                return '<div class="adj-row"><span>' + arNames[k] + '</span><div class="adj-ctl">' +
                    '<button class="adj-btn" onclick="adjust(\'' + t + '\',\'' + k + '\',-1)">-</button>' +
                    '<span class="adj-val">' + v + '</span>' +
                    '<button class="adj-btn" onclick="adjust(\'' + t + '\',\'' + k + '\',1)">+</button></div></div>';
            };
            adH += row('adhan', userOffsets.adhan[k]);
            iqH += row('iqama', defaultIqama[k] + userOffsets.iqama[k]);
            if (k !== 'Sunrise') blH += row('black', userOffsets.black[k]);
        });
        $('adhanAdjList').innerHTML = adH;
        $('iqamaAdjList').innerHTML = iqH;
        $('blackScreenAdjList').innerHTML = blH;
    }

    // =========================================================================
    // === صور الإعلانات حسب المناسبة ===
    // =========================================================================
    var lastPromoUpdate = 0;

    function getCurrentOccasion(hijriDay, hijriMonth, isFriday) {
        if (hijriMonth === 9) return "ramadan";
        if (hijriMonth === 10 && hijriDay >= 1 && hijriDay <= 3) return "eid_fitr";
        if (hijriMonth === 12 && hijriDay >= 1 && hijriDay <= 13) return "hajj";
        if (hijriMonth === 1 && hijriDay === 10) return "ashura";
        if (isFriday) return "friday";
        return "default";
    }

    function changePromoImage(currentOccasion) {
        var list = promoImages.filter(function(img) { return img.type === currentOccasion; });
        if (list.length === 0) list = promoImages.filter(function(img) { return img.type === 'default'; });
        if (list.length > 0) $('promoImage').src = list[Math.floor(Math.random() * list.length)].url;
    }

    function format12h(timeStr, offset) {
        offset = offset || 0;
        var parts = timeStr.split(' ')[0].split(':');
        var d = new Date();
        d.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10) + offset, 0);
        var nh = d.getHours() % 12 || 12;
        var p  = d.getHours() >= 12 ? 'م' : 'ص';
        return '<span>' + String(nh).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + '</span><span style="font-size:0.58em;font-weight:900;margin-right:2px;">' + p + '</span>';
    }

    // =========================================================================
    // === المحرك الرئيسي ===
    // =========================================================================
    var engineOn = false;

    function startEngine() {
        if (engineOn || !prayerData) return;
        engineOn = true;
        var n = new Date();
        var mi = prayerData[n.getMonth() + 1];
        var t0 = mi ? mi[n.getDate() - 1] : null;
        if (t0) changePromoImage(getCurrentOccasion(parseInt(t0.date.hijri.day, 10), parseInt(t0.date.hijri.month.number, 10), n.getDay() === 5));
        setInterval(update, 1000);
        update();
    }

    function update() {
        var now = new Date();
        if (!prayerData) return;
        var monthData = prayerData[now.getMonth() + 1];
        if (!monthData) return;
        var today = monthData[now.getDate() - 1];
        if (!today) return;

        // تحديث تلقائي هادئ عند تغيّر السنة (يحتاج إنترنت؛ وإلا يستمر بالبيانات المحفوظة)
        if (!isFresh()) refreshData(false);

        var hijriDay = parseInt(today.date.hijri.day, 10);
        var hijriMonth = parseInt(today.date.hijri.month.number, 10);
        var isFriday = now.getDay() === 5;
        var currentOccasion = getCurrentOccasion(hijriDay, hijriMonth, isFriday);

        $('mainClock').innerText     = String(now.getHours() % 12 || 12).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        $('secondsClock').innerText  = String(now.getSeconds()).padStart(2,'0');
        $('ampm').innerText          = now.getHours() >= 12 ? 'م' : 'ص';
        $('dayName').innerText       = now.toLocaleDateString('ar-SA', { weekday: 'long' });
        $('hijriDate').innerText     = today.date.hijri.day + ' ' + today.date.hijri.month.ar + ' ' + today.date.hijri.year;
        $('gregorianDate').innerText = now.toLocaleDateString('ar-SA-u-ca-gregory', { day: 'numeric', month: 'long', year: 'numeric' });

        var nextP = null;
        var listHtml = '';

        for (var ki = 0; ki < keys.length; ki++) {
            var k = keys[ki];
            var parts = today.timings[k].split(' ')[0].split(':');
            var h = parseInt(parts[0], 10);
            var m = parseInt(parts[1], 10);
            var adhanT = new Date(now); adhanT.setHours(h, m + userOffsets.adhan[k], 0, 0);
            var iqamaT = new Date(now); iqamaT.setHours(h, m + userOffsets.adhan[k] + defaultIqama[k] + userOffsets.iqama[k], 0, 0);
            var name = (isFriday && k === 'Dhuhr') ? 'الجمعة' : arNames[k];
            if (!nextP && (now < adhanT || (k !== 'Sunrise' && now < iqamaT))) {
                nextP = now < adhanT
                    ? { n: name, t: adhanT, type: 'لوقت',        key: k }
                    : { n: name, t: iqamaT, type: 'لإقامة صلاة', key: k };
            }
            var isActive = (nextP && k === nextP.key) ? 'next-active' : '';
            var iqamaCol = k === 'Sunrise' ? '--:--' : format12h(today.timings[k], userOffsets.adhan[k] + defaultIqama[k] + userOffsets.iqama[k]);
            listHtml += '<div class="prayer-row ' + isActive + '">'
                      + '<div class="col-name">'  + name + '</div>'
                      + '<div class="col-adhan">' + format12h(today.timings[k], userOffsets.adhan[k]) + '</div>'
                      + '<div class="col-iqama">' + iqamaCol + '</div>'
                      + '</div>';
        }

        if (!nextP) {
            var tom = new Date(now); tom.setDate(now.getDate() + 1);
            var tm  = prayerData[tom.getMonth() + 1];
            var td  = tm ? tm[tom.getDate() - 1] : null;
            if (td) {
                var fp = td.timings.Fajr.split(' ')[0].split(':');
                var nf = new Date(tom); nf.setHours(parseInt(fp[0], 10), parseInt(fp[1], 10) + userOffsets.adhan.Fajr, 0, 0);
                nextP = { n: arNames.Fajr, t: nf, type: 'لوقت', key: 'Fajr' };
            }
        }

        $('prayerList').innerHTML = listHtml;

        if (nextP) {
            var diff = nextP.t - now;
            var hh = Math.floor(diff / 3600000);
            var mm = Math.floor((diff % 3600000) / 60000);
            var ss = Math.floor((diff % 60000) / 1000);
            $('nextPrayerCountdown').innerHTML =
                'المتبقي ' + nextP.type + ' ' + nextP.n +
                ' <span class="cd-time">' +
                String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0') +
                '</span>';
            handlePromoAnimation(nextP.type === 'لوقت', currentOccasion);
        }

        for (var ki2 = 0; ki2 < keys.length; ki2++) {
            var k2 = keys[ki2];
            var parts2 = today.timings[k2].split(' ')[0].split(':');
            var h2 = parseInt(parts2[0], 10);
            var m2 = parseInt(parts2[1], 10);
            var adhanT2 = new Date(now); adhanT2.setHours(h2, m2 + userOffsets.adhan[k2], 0, 0);
            var iqamaT2 = new Date(now); iqamaT2.setHours(h2, m2 + userOffsets.adhan[k2] + defaultIqama[k2] + userOffsets.iqama[k2], 0, 0);
            var name2 = (isFriday && k2 === 'Dhuhr') ? 'الجمعة' : arNames[k2];

            if (now >= adhanT2 && now < new Date(adhanT2.getTime() + 30000) && !window.aAct) {
                window.aAct = true;
                $('alertTitle').innerText      = 'الآن يرفع أذان';
                $('alertPrayerName').innerText = name2;
                $('alertOverlay').classList.add('active');
                setTimeout(function() { $('alertOverlay').classList.remove('active'); window.aAct = false; }, 30000);
            }

            if (k2 !== 'Sunrise' && now >= iqamaT2 && now < new Date(iqamaT2.getTime() + 10000) && !window.iAct) {
                window.iAct = true;
                $('alertTitle').innerText      = 'الآن تقام صلاة';
                $('alertPrayerName').innerText = name2;
                $('alertOverlay').classList.add('active');
                (function(capturedKey) {
                    setTimeout(function() {
                        $('alertOverlay').classList.remove('active');
                        var bDur = userOffsets.black[capturedKey] || 0;
                        if (bDur > 0) {
                            $('blackOverlay').classList.add('active');
                            setTimeout(function() {
                                $('blackOverlay').classList.remove('active');
                                showPostDhikr(capturedKey);
                                window.iAct = false;
                            }, bDur * 60000);
                        } else {
                            showPostDhikr(capturedKey);
                            window.iAct = false;
                        }
                    }, 10000);
                })(k2);
            }
        }
    }

    function handlePromoAnimation(isAdhanCountdown, currentOccasion) {
        var table = $('prayerList');
        var promo = $('promoImage');
        if (!isAdhanCountdown) {
            table.style.transform = 'translateY(0)';
            promo.style.transform = 'translateY(105%)';
            return;
        }
        var cycle    = 3 * 60 * 1000;
        var show     = 1 * 60 * 1000;
        var progress = Date.now() % cycle;
        if (progress < show) {
            table.style.transform = 'translateY(-110%)';
            promo.style.transform = 'translateY(0)';
        } else {
            table.style.transform = 'translateY(0)';
            promo.style.transform = 'translateY(105%)';
            // تبديل الصورة فقط وهي مخفية حتى لا يظهر تغيّر مفاجئ
            if (Date.now() - lastPromoUpdate > show) {
                changePromoImage(currentOccasion);
                lastPromoUpdate = Date.now();
            }
        }
    }

    function showPostDhikr(prayerKey) {
        var mode    = lsGet(DHIKR_MODE_K) || 'cards';
        var overlay = $('afterPrayerOverlay');
        var area    = $('dhikrDisplayArea');
        var img     = $('dhikrImageDisplay');

        if (prayerKey === 'Fajr')                                  img.src = DHIKR_IMG_FAJR;
        else if (prayerKey === 'Dhuhr' || prayerKey === 'Asr')     img.src = DHIKR_IMG_DHUHR_ASR;
        else if (prayerKey === 'Maghrib' || prayerKey === 'Isha')  img.src = DHIKR_IMG_MAGH_ISHA;
        else                                                       img.src = DHIKR_IMG_DEFAULT;

        overlay.style.display = 'flex';
        setTimeout(function() { overlay.classList.add('fade-in'); }, 10);

        if (mode === 'image') {
            area.style.display = 'none';
            img.style.display  = 'block';
            setTimeout(function() {
                overlay.classList.remove('fade-in');
                setTimeout(function() { overlay.style.display = 'none'; }, 1000);
            }, 5 * 60000);
        } else {
            img.style.display  = 'none';
            area.style.display = 'flex';
            var list = [
                {t:"أَسْـتَغْفِرُ الله", r:"3 مرات"},
                {t:"اللّهُـمَّ أَنْـتَ السَّلامُ، وَمِـنْكَ السَّلامُ، تَبارَكْتَ يا ذا الجَـلالِ وَالإِكْـرام.", r:"مرة واحدة"},
                {t:"سُـبْحانَ الله", r:"33 مرة"},
                {t:"الحَمْـدُ لله", r:"33 مرة"},
                {t:"اللهُ أكْـبَر", r:"33 مرة"},
                {t:"لا إلهَ إلاّ اللّهُ وحدَهُ لا شريكَ لهُ، لهُ المُـلْكُ ولهُ الحَمْد، وهوَ على كلّ شَيءٍ قَدير.", r:"مرة واحدة"},
                {t:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.", r:"مرة واحدة"}
            ];
            area.innerHTML = '';
            for (var i = 0; i < list.length; i++) {
                var card = document.createElement('div');
                card.className = 'card-dhikr';
                card.id = 'd-card-' + i;
                var p1 = document.createElement('p'); p1.className = 'ct'; p1.textContent = list[i].t;
                var p2 = document.createElement('p'); p2.className = 'cr'; p2.textContent = list[i].r;
                card.appendChild(p1); card.appendChild(p2);
                area.appendChild(card);
            }
            var idx = 0;
            function run() {
                if (idx > 0) $('d-card-' + (idx - 1)).classList.remove('active');
                if (idx >= list.length) {
                    overlay.classList.remove('fade-in');
                    setTimeout(function() { overlay.style.display = 'none'; }, 1000);
                    return;
                }
                $('d-card-' + idx).classList.add('active');
                idx++;
                setTimeout(run, 50000);
            }
            run();
        }
    }

    setInterval(function() {
        var el = $('dhikrText');
        el.classList.add('dhikr-fade');
        setTimeout(function() {
            setDhikrText(dhikrList[Math.floor(Math.random() * dhikrList.length)]);
            el.classList.remove('dhikr-fade');
        }, 600);
    }, 5000);

    // =========================================================================
    // === التشغيل ===
    // =========================================================================
    async function init() {
        renderAdjusters();
        populateCities();
        var savedMode = lsGet(DHIKR_MODE_K);
        if (savedMode === 'cards' || savedMode === 'image') $('dhikrModeSelect').value = savedMode;
        applyLayout();
        renderDataInfo();

        // 1) عرض فوري من البيانات المحفوظة (يعمل بدون إنترنت)
        var hadCache = loadCached();
        if (hadCache) { renderDataInfo(); startEngine(); }
        else $('nextPrayerCountdown').textContent = 'جاري تحميل المواقيت...';

        // 2) تحديث من المصدر عند الحاجة
        var ok = await refreshData(false);
        if (prayerData && !engineOn) startEngine();

        // 3) إن لم تتوفر أي بيانات (أول تشغيل بلا إنترنت) نعيد المحاولة كل 30 ثانية
        if (!prayerData) {
            $('nextPrayerCountdown').textContent = 'تعذّر تحميل المواقيت — إعادة المحاولة...';
            var retry = setInterval(async function() {
                if (await refreshData(true)) { clearInterval(retry); startEngine(); }
            }, 30000);
        }
    }

    window.addEventListener('online', function() { if (!isFresh()) refreshData(false).then(function() { if (prayerData && !engineOn) startEngine(); }); });
    setInterval(function() { if (!isFresh()) refreshData(false); }, 6 * 3600 * 1000);

    init();
</script>
